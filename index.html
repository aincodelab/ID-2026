<script>
(function() {
  'use strict';

  const API_URL = 'https://script.google.com/macros/s/AKfycbxUFmxXqA6ZfWMkcJw2yQJs-WZ1MsdIBIKaptKzSgRjcfNWw6GXUdGZVbZkjTXf4XSA/exec';
  const PAGE_SIZE = 15;

  const state = {
    headers: [],
    data: [],
    currentPage: 1,
    totalPages: 0,
    editingRow: null,        // fisik row
    dropdowns: {},
    dropdownLoading: {},
    isPreloaded: false,
    searchQuery: '',
  };

  const $ = id => document.getElementById(id);
  const dom = {
    loading: $('loadingOverlay'),
    modal: $('modal'),
    modalPanel: $('modalPanel'),
    modalTitle: $('modalTitle'),
    modalForm: $('modalForm'),
    output: $('output'),
    openBtn: $('openModalBtn'),
    floatingBtn: $('floatingAddBtn'),
    cancelBtn: $('cancelBtn'),
    submitBtn: $('submitBtn'),
    closeBtn: $('modalCloseBtn'),
    prevPage: $('prevPage'),
    nextPage: $('nextPage'),
    firstPage: $('firstPage'),
    lastPage: $('lastPage'),
    pageInfo: $('pageInfo'),
    thead: $('tableHeader'),
    tbody: $('tableBody'),
    cardContainer: $('cardContainer'),
    searchInput: $('searchInput'),
    searchBtn: $('searchBtn'),
    resetSearchBtn: $('resetSearchBtn'),
  };

  function showLoading(show) { dom.loading.style.display = show ? 'flex' : 'none'; }
  function setOutput(msg, isError = false) {
    const icon = isError ? 'fa-circle-exclamation text-red-500' : 'fa-terminal text-gray-400';
    dom.output.innerHTML = `<i class="fas ${icon} mr-2"></i><span>${msg}</span>`;
  }
  function toast(icon, title) {
    Swal.fire({ icon, title, toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true, backdrop: false });
  }
  function showError(msg) {
    Swal.fire({ icon: 'error', title: 'Oops...', text: msg, confirmButtonColor: '#4f46e5' });
  }
  function confirmDelete(row) {
    return Swal.fire({
      title: 'Hapus Data?',
      html: `Yakin ingin menghapus <strong>Baris ${row}</strong>?`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#6b7280',
      confirmButtonText: '<i class="fas fa-trash mr-2"></i> Ya, hapus',
      cancelButtonText: 'Batal',
      reverseButtons: true,
      focusCancel: true,
    });
  }
  function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

  // --- DROPDOWN ---
  async function fetchDropdownOptions(fieldName) {
    if (state.dropdowns[fieldName]) return state.dropdowns[fieldName];
    if (state.dropdownLoading[fieldName]) {
      return new Promise(resolve => {
        const check = setInterval(() => {
          if (!state.dropdownLoading[fieldName]) {
            clearInterval(check);
            resolve(state.dropdowns[fieldName] || []);
          }
        }, 100);
      });
    }
    state.dropdownLoading[fieldName] = true;
    try {
      const res = await fetch(`${API_URL}?action=dropdown&field=${encodeURIComponent(fieldName)}`);
      const json = await res.json();
      state.dropdowns[fieldName] = (json.data && Array.isArray(json.data)) ? json.data : [];
      return state.dropdowns[fieldName];
    } catch (err) {
      console.error('Dropdown error:', err);
      state.dropdowns[fieldName] = [];
      return [];
    } finally {
      state.dropdownLoading[fieldName] = false;
    }
  }

  async function preloadAllDropdowns() {
    if (state.isPreloaded) return;
    const fields = state.headers.filter(f => f !== 'row');
    if (fields.length === 0) return;
    await Promise.all(fields.map(f => fetchDropdownOptions(f)));
    state.isPreloaded = true;
    console.log('✅ Semua dropdown preloaded');
  }

  // --- MODAL ---
  function resetForm() {
    dom.modalForm.querySelectorAll('input, select').forEach(el => {
      el.value = '';
      el.classList.remove('border-red-400', 'ring-1', 'ring-red-300');
    });
  }

  function buildForm(data = {}) {
    dom.modalForm.innerHTML = '';
    for (const field of state.headers) {
      if (field === 'row') continue;
      const div = document.createElement('div');
      div.className = 'field-group';
      const label = document.createElement('label');
      label.textContent = capitalize(field) + ':';

      const options = state.dropdowns[field] || [];
      let input;
      if (options.length > 0) {
        const select = document.createElement('select');
        select.name = field;
        select.id = 'field_' + field;
        const def = document.createElement('option');
        def.value = '';
        def.textContent = '-- Pilih --';
        select.appendChild(def);
        options.forEach(opt => {
          const o = document.createElement('option');
          o.value = opt.uraian;
          o.textContent = opt.uraian;
          select.appendChild(o);
        });
        if (data[field] !== undefined && data[field] !== null) {
          select.value = data[field].toString();
        }
        input = select;
      } else {
        const inp = document.createElement('input');
        inp.name = field;
        inp.id = 'field_' + field;
        inp.value = data[field] !== undefined && data[field] !== null ? data[field] : '';
        const lower = field.toLowerCase();
        if (lower.includes('email')) inp.type = 'email';
        else if (lower.includes('date')) inp.type = 'date';
        else if (lower.includes('phone') || lower.includes('tel')) inp.type = 'tel';
        else if (lower.includes('number') || lower.includes('age') || lower.includes('id')) inp.type = 'number';
        else inp.type = 'text';
        input = inp;
      }
      div.appendChild(label);
      div.appendChild(input);
      dom.modalForm.appendChild(div);
    }
  }

  function showModal(show) {
    if (show) {
      dom.modal.classList.remove('hidden');
      dom.modal.style.display = 'flex';
      requestAnimationFrame(() => dom.modalPanel.classList.add('active'));
    } else {
      dom.modalPanel.classList.remove('active');
      setTimeout(() => {
        dom.modal.style.display = 'none';
        dom.modal.classList.add('hidden');
      }, 200);
    }
  }

  function openModalForCreate() {
    state.editingRow = null;
    dom.modalTitle.innerHTML = `<i class="fas fa-plus-circle text-indigo-500 mr-2"></i> Tambah Data Baru`;
    resetForm();
    buildForm();
    showModal(true);
    setTimeout(() => {
      const first = dom.modalForm.querySelector('input, select');
      if (first) first.focus();
    }, 250);
  }

  function openModalForEdit(rowData, rowNum) {
    state.editingRow = rowNum;   // fisik
    dom.modalTitle.innerHTML = `<i class="fas fa-pen-to-square text-indigo-500 mr-2"></i> Edit Data (Baris ${rowNum})`;
    resetForm();
    buildForm(rowData);
    showModal(true);
    setTimeout(() => {
      const first = dom.modalForm.querySelector('input, select');
      if (first) first.focus();
    }, 250);
  }

  function closeModal() {
    showModal(false);
    resetForm();
    state.editingRow = null;
  }

  // --- CRUD ---
  async function fetchData(page, search = state.searchQuery) {
    showLoading(true);
    const searchTerm = search ? search.trim() : '';
    setOutput(searchTerm ? `Mencari "${searchTerm}" ...` : 'Memuat data...');
    try {
      let url = `${API_URL}?action=read&page=${page}&pageSize=${PAGE_SIZE}`;
      if (searchTerm) {
        url += `&search=${encodeURIComponent(searchTerm)}`;
      }
      const res = await fetch(url);
      const json = await res.json();
      if (json.data && Array.isArray(json.data)) {
        state.headers = Object.keys(json.data[0] || {});
        state.currentPage = json.page || 1;
        state.totalPages = json.totalPages || 0;
        state.data = json.data;
        state.searchQuery = searchTerm;
        if (state.data.length === 0 && state.currentPage > 1) {
          await fetchData(state.currentPage - 1, searchTerm);
          return;
        }
        await preloadAllDropdowns();
        renderData();
        updatePagination();
        const info = searchTerm ? `Hasil pencarian "${searchTerm}"` : `Halaman ${state.currentPage}`;
        setOutput(`${info} · ${state.data.length} data dari ${json.totalRecords || 0} total`);
      } else {
        state.data = [];
        state.headers = [];
        state.totalPages = 0;
        renderData();
        updatePagination();
        setOutput(searchTerm ? `Tidak ada data untuk "${searchTerm}"` : 'Tidak ada data', false);
      }
    } catch (err) {
      setOutput('Gagal memuat: ' + err.message, true);
      showError('Gagal memuat data: ' + err.message);
    } finally {
      showLoading(false);
    }
  }

  async function handleSubmit() {
    const fields = dom.modalForm.querySelectorAll('input, select');
    const formData = {};
    let valid = true;
    fields.forEach(el => {
      const val = el.value.trim();
      if (val === '') {
        el.classList.add('border-red-400', 'ring-1', 'ring-red-300');
        valid = false;
      } else {
        el.classList.remove('border-red-400', 'ring-1', 'ring-red-300');
        formData[el.name] = val;
      }
    });
    if (!valid) { toast('warning', 'Semua field wajib diisi'); return; }

    const action = state.editingRow ? 'update' : 'create';
    if (state.editingRow) formData.row = state.editingRow;   // fisik

    showLoading(true);
    setOutput(action === 'create' ? 'Menyimpan...' : 'Memperbarui...');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, ...formData })
      });
      const json = await res.json();
      if (json.success) {
        closeModal();
        toast('success', action === 'create' ? 'Data berhasil ditambahkan!' : 'Data diperbarui!');
        fetchData(state.currentPage, state.searchQuery);
      } else {
        const err = json.error || json.message || 'Terjadi kesalahan';
        showError(err);
        setOutput('Error: ' + err, true);
      }
    } catch (err) {
      showError('Gagal mengirim request: ' + err.message);
      setOutput('Error: ' + err.message, true);
    } finally {
      showLoading(false);
    }
  }

  async function deleteRow(rowNum) {
    const result = await confirmDelete(rowNum);
    if (!result.isConfirmed) return;
    showLoading(true);
    setOutput(`Menghapus baris ${rowNum}...`);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', row: rowNum })
      });
      const json = await res.json();
      if (json.success) {
        toast('success', `Baris ${rowNum} berhasil dihapus`);
        fetchData(state.currentPage, state.searchQuery);
      } else {
        const err = json.error || 'Gagal menghapus';
        showError(err);
        setOutput('Error: ' + err, true);
      }
    } catch (err) {
      showError('Gagal menghapus: ' + err.message);
      setOutput('Error: ' + err.message, true);
    } finally {
      showLoading(false);
    }
  }

  // --- SEARCH ---
  function performSearch() {
    const query = dom.searchInput.value.trim();
    if (query === state.searchQuery) return;
    fetchData(1, query);
  }

  function resetSearch() {
    dom.searchInput.value = '';
    if (state.searchQuery === '') return;
    fetchData(1, '');
  }

  // --- RENDER DUAL MODE ---
  function isMobile() { return window.innerWidth < 768; }

  function renderData() {
    if (isMobile()) renderCards();
    else renderTable();
  }

  function renderTable() {
    const thead = dom.thead;
    const tbody = dom.tbody;
    thead.innerHTML = '';
    tbody.innerHTML = '';
    if (!state.data || state.data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="99" class="empty-state"><i class="fas fa-inbox"></i><p>${state.searchQuery ? 'Tidak ada data untuk pencarian' : 'Tidak ada data'}</p></td></tr>`;
      return;
    }
    // Tambahkan kolom "Baris" (fisik) di awal
    const headersDisplay = ['Baris', ...state.headers.filter(h => h !== 'row')];
    headersDisplay.forEach(field => {
      const th = document.createElement('th');
      th.textContent = field === 'Baris' ? '#' : capitalize(field);
      th.className = 'text-left font-semibold text-gray-700 text-xs uppercase tracking-wider bg-gray-100/80 border-b border-gray-200';
      thead.appendChild(th);
    });
    const thAction = document.createElement('th');
    thAction.textContent = 'Aksi';
    thAction.className = 'text-center font-semibold text-gray-700 text-xs uppercase tracking-wider bg-gray-100/80 border-b border-gray-200';
    thead.appendChild(thAction);

    state.data.forEach((row, idx) => {
      const tr = document.createElement('tr');
      tr.className = (idx % 2 === 0) ? 'bg-white hover:bg-gray-50/70' : 'bg-gray-50/50 hover:bg-gray-100/70';
      // Kolom Baris
      const tdRow = document.createElement('td');
      tdRow.textContent = row.row;   // fisik
      tdRow.className = 'text-gray-800 text-sm font-medium';
      tr.appendChild(tdRow);
      // Kolom data lainnya
      state.headers.forEach(field => {
        if (field === 'row') return;
        const td = document.createElement('td');
        td.textContent = row[field] !== undefined && row[field] !== null ? row[field] : '';
        td.className = 'text-gray-800 text-sm';
        tr.appendChild(td);
      });
      // Kolom Aksi
      const tdAction = document.createElement('td');
      tdAction.className = 'text-center';
      const btnEdit = document.createElement('button');
      btnEdit.className = 'action-btn bg-amber-400 hover:bg-amber-500 text-white mr-1';
      btnEdit.innerHTML = `<i class="fas fa-pen"></i><span class="label">Edit</span>`;
      btnEdit.onclick = () => openModalForEdit(row, row.row);
      const btnDelete = document.createElement('button');
      btnDelete.className = 'action-btn bg-rose-500 hover:bg-rose-600 text-white';
      btnDelete.innerHTML = `<i class="fas fa-trash-can"></i><span class="label">Hapus</span>`;
      btnDelete.onclick = () => deleteRow(row.row);
      tdAction.appendChild(btnEdit);
      tdAction.appendChild(btnDelete);
      tr.appendChild(tdAction);
      tbody.appendChild(tr);
    });
  }

  function renderCards() {
    const container = dom.cardContainer;
    container.innerHTML = '';
    if (!state.data || state.data.length === 0) {
      container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${state.searchQuery ? 'Tidak ada data untuk pencarian' : 'Tidak ada data'}</p></div>`;
      return;
    }
    state.data.forEach((row, idx) => {
      const card = document.createElement('div');
      card.className = 'card-item';
      // Tampilkan nomor baris fisik
      const rowDiv = document.createElement('div');
      rowDiv.className = 'field-row';
      const rowLabel = document.createElement('span');
      rowLabel.className = 'field-label';
      rowLabel.textContent = 'Baris :';
      const rowValue = document.createElement('span');
      rowValue.className = 'field-value';
      rowValue.textContent = row.row;
      rowDiv.appendChild(rowLabel);
      rowDiv.appendChild(rowValue);
      card.appendChild(rowDiv);

      state.headers.forEach(field => {
        if (field === 'row') return;
        const div = document.createElement('div');
        div.className = 'field-row';
        const label = document.createElement('span');
        label.className = 'field-label';
        label.textContent = capitalize(field) + ' :';
        const value = document.createElement('span');
        value.className = 'field-value';
        value.textContent = row[field] !== undefined && row[field] !== null ? row[field] : '';
        div.appendChild(label);
        div.appendChild(value);
        card.appendChild(div);
      });
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'card-actions';
      const btnEdit = document.createElement('button');
      btnEdit.className = 'action-btn bg-amber-400 hover:bg-amber-500 text-white';
      btnEdit.innerHTML = `<i class="fas fa-pen"></i><span class="label">Edit</span>`;
      btnEdit.onclick = () => openModalForEdit(row, row.row);
      const btnDelete = document.createElement('button');
      btnDelete.className = 'action-btn bg-rose-500 hover:bg-rose-600 text-white';
      btnDelete.innerHTML = `<i class="fas fa-trash-can"></i><span class="label">Hapus</span>`;
      btnDelete.onclick = () => deleteRow(row.row);
      actionsDiv.appendChild(btnEdit);
      actionsDiv.appendChild(btnDelete);
      card.appendChild(actionsDiv);
      container.appendChild(card);
    });
  }

  function updatePagination() {
    dom.pageInfo.textContent = `Halaman ${state.currentPage} dari ${state.totalPages || 1}`;
    dom.prevPage.disabled = state.currentPage <= 1;
    dom.nextPage.disabled = state.currentPage >= state.totalPages || state.totalPages === 0;
    dom.firstPage.disabled = state.currentPage <= 1;
    dom.lastPage.disabled = state.currentPage >= state.totalPages || state.totalPages === 0;
  }

  // --- INIT ---
  let resizeTimer;
  function handleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderData(), 250);
  }

  function init() {
    dom.openBtn.addEventListener('click', openModalForCreate);
    dom.floatingBtn.addEventListener('click', openModalForCreate);

    dom.cancelBtn.addEventListener('click', closeModal);
    dom.closeBtn.addEventListener('click', closeModal);
    dom.modal.addEventListener('click', (e) => { if (e.target === dom.modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dom.modal.style.display === 'flex') closeModal(); });
    dom.submitBtn.addEventListener('click', (e) => { e.preventDefault(); handleSubmit(); });

    dom.prevPage.addEventListener('click', () => { if (state.currentPage > 1) fetchData(state.currentPage - 1, state.searchQuery); });
    dom.nextPage.addEventListener('click', () => { if (state.currentPage < state.totalPages) fetchData(state.currentPage + 1, state.searchQuery); });
    dom.firstPage.addEventListener('click', () => { if (state.currentPage > 1) fetchData(1, state.searchQuery); });
    dom.lastPage.addEventListener('click', () => { if (state.currentPage < state.totalPages) fetchData(state.totalPages, state.searchQuery); });

    dom.searchBtn.addEventListener('click', performSearch);
    dom.resetSearchBtn.addEventListener('click', resetSearch);
    dom.searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    window.addEventListener('resize', handleResize);
    fetchData(1, '');
  }

  init();

})();
</script>

</body>
</html>
